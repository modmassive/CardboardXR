
name: CardboardXR iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone application
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch \
            /Applications/Xcode_16.4.app/Contents/Developer

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download verified CardboardXR export
        run: |
          ARCHIVE="$RUNNER_TEMP/CardboardXR-iOS-export.tar.gz"

          curl --fail --location --retry 3 \
            "https://github.com/modmassive/CardboardXR/releases/download/cardboardxr-ios-export-2026-11-02/CardboardXR-iOS-export.tar.gz" \
            --output "$ARCHIVE"

          echo "710410b3e37c858323766df6cec8e0a921792ea2bd585ba593ba328c8abfa875  $ARCHIVE" \
            | shasum -a 256 -c -

      - name: Extract Xcode project
        run: |
          mkdir -p "$RUNNER_TEMP/cardboardxr"

          tar -xzf \
            "$RUNNER_TEMP/CardboardXR-iOS-export.tar.gz" \
            -C "$RUNNER_TEMP/cardboardxr"

          IOS_DIR="$RUNNER_TEMP/cardboardxr/iOS"

          test -f "$IOS_DIR/Unity-iPhone.xcodeproj/project.pbxproj"

          test -f "$IOS_DIR/Unity-iPhone.xcodeproj/xcshareddata/xcschemes/Unity-iPhone.xcscheme"

          echo "Xcode project verified."

      - name: Compile iOS application without Apple signing
        run: |
          set -o pipefail

          IOS_DIR="$RUNNER_TEMP/cardboardxr/iOS"

          xcodebuild \
            -project "$IOS_DIR/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP_PATH="$PRODUCTS/CardboardXR.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected application not found: $APP_PATH"
            find "$PRODUCTS" -maxdepth 3 -print
            exit 1
          fi

          if [[ ! -f "$APP_PATH/Info.plist" ]]; then
            echo "Application Info.plist was not found."
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP_PATH/Info.plist" 2>/dev/null) || {
              echo "Could not read application bundle identifier."
              exit 1
            }

          if [[ "$BUNDLE_ID" != "com.brenpoly.cardboardxr" ]]; then
            echo "Unexpected bundle identifier: $BUNDLE_ID"
            echo "Expected: com.brenpoly.cardboardxr"
            exit 1
          fi

          echo "Found CardboardXR application."
          echo "Bundle identifier: $BUNDLE_ID"

          IPA_ROOT="$RUNNER_TEMP/ipa-root"
          mkdir -p "$IPA_ROOT/Payload"

          ditto "$APP_PATH" "$IPA_ROOT/Payload/$(basename "$APP_PATH")"

          cd "$IPA_ROOT"

          IPA_PATH="$GITHUB_WORKSPACE/CardboardXR-unsigned.ipa"

          ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            "$IPA_PATH"

          echo "Initial IPA created."

          # Work around Sideloadly Info.plist signature hashing.
          # Store all app and nested framework Info.plist files
          # without ZIP compression.

          python3 - "$IPA_PATH" <<'PY'
          import copy
          import os
          import re
          import sys
          import zipfile

          ipa_path = sys.argv[1]
          temp_path = ipa_path + ".tmp"

          plist_pattern = re.compile(
              r"\.(?:app|framework|appex|bundle|xpc|watchkitapp|watchkitextension)/Info\.plist$"
          )

          with zipfile.ZipFile(ipa_path, "r") as source:
              entries = source.infolist()

              with zipfile.ZipFile(temp_path, "w") as target:
                  target.comment = source.comment

                  for entry in entries:
                      copied = copy.copy(entry)
                      data = source.read(entry.filename)

                      if plist_pattern.search(entry.filename):
                          copied.compress_type = zipfile.ZIP_STORED

                      target.writestr(copied, data)

          os.replace(temp_path, ipa_path)

          with zipfile.ZipFile(ipa_path, "r") as check:
              plist_entries = [
                  entry for entry in check.infolist()
                  if plist_pattern.search(entry.filename)
              ]

              compressed = [
                  entry.filename for entry in plist_entries
                  if entry.compress_type != zipfile.ZIP_STORED
              ]

              bad_entries = [
                  entry.filename for entry in check.infolist()
                  if entry.filename.startswith("Payload/")
                  and entry.filename.endswith("/")
              ]

              if not plist_entries:
                  raise SystemExit(
                      "ERROR: No application Info.plist files found."
                  )

              if compressed:
                  raise SystemExit(
                      "ERROR: Compressed Info.plist files remain: "
                      + ", ".join(compressed)
                  )

              bad_files = check.testzip()

              if bad_files:
                  raise SystemExit(
                      "ERROR: IPA ZIP integrity failure: " + bad_files
                  )

          print(
              f"Verified {len(plist_entries)} app/framework "
              "Info.plist files are uncompressed."
          )

          print("IPA ZIP integrity verification passed.")
          PY

          echo "IPA created and verified successfully."

          ls -lh "$IPA_PATH"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-unsigned-IPA
          path: CardboardXR-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-Xcode-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
